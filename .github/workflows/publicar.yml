name: Testar e publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Testes e compilação rodam sempre. A publicação no GitHub Pages só acontece em repositório
# público: no plano gratuito do GitHub, repositório privado não tem Pages.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - if: ${{ !github.event.repository.private }}
        uses: actions/configure-pages@v6
      - if: ${{ !github.event.repository.private }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: ${{ !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
